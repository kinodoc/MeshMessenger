name: Validate bug report changes

on:
  push:
    branches: ["bugs", "main"]
    paths:
      - "bugreport-server/**"
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/validate-bugreport.yml"
  pull_request:
    paths:
      - "bugreport-server/**"
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - ".github/workflows/validate-bugreport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile bugreport-server/server.py bugreport-server/test_server.py
      - name: Unit tests
        run: python -m unittest discover -s bugreport-server -p 'test_*.py' -v

  android-compile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug || {
            find "$HOME/.gradle/wrapper/dists" -type f -path "*/bin/gradle" -exec chmod +x {} + 2>/dev/null || true
            ./gradlew --no-daemon :app:assembleDebug
          }
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
