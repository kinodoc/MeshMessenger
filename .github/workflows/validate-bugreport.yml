name: Validate bug report changes

on:
  pull_request:
    paths:
      - "bugreport-server/**"
      - "app/src/main/java/com/example/meshmessenger/MainActivity.kt"
      - ".github/workflows/validate-bugreport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile bugreport-server/server.py bugreport-server/test_server.py
      - name: Unit tests
        run: python -m unittest discover -s bugreport-server -p 'test_*.py' -v

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
