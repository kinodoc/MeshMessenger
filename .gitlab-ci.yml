image: eclipse-temurin:17-jdk

stages:
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-android
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

build_debug_apk:
  stage: build
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends wget unzip ca-certificates
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdline-tools.zip
    - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null || true
    - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip
    - unzip -q /tmp/gradle.zip -d /opt
    - export PATH="/opt/gradle-8.13/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    - gradle --version
  script:
    - gradle --no-daemon :app:assembleDebug
  artifacts:
    name: "MeshMessenger-$CI_COMMIT_SHORT_SHA-debug"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 30 days
