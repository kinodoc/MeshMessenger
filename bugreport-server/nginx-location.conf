# Include inside the HTTPS server block. Never expose port 8765 publicly.
location = /health {
    proxy_pass http://127.0.0.1:8765/health;
    proxy_set_header Host $host;
}
location = /api/bugreports {
    client_max_body_size 10m;
    proxy_read_timeout 25s;
    proxy_pass http://127.0.0.1:8765/api/bugreports;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# MeshMessenger private update channel. APKs are public only to the HTTPS endpoint.
location ^~ /mesh-update/ {
    alias /var/www/html/mesh-update/;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
