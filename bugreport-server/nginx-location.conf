# Include in the HTTPS server block for your chosen report domain.
# Do not expose port 8765 publicly; proxy only through TLS.
location = /health {
    proxy_pass http://127.0.0.1:8765/health;
    proxy_set_header Host $host;
}
location = /api/bugreports {
    client_max_body_size 10m;
    proxy_read_timeout 25s;
    proxy_pass http://127.0.0.1:8765/api/bugreports;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# Configure reports with expiry/retention before enabling public downloads.
# A public, long-lived ZIP URL can expose device diagnostics.

location ~ ^/reports/[A-Za-z0-9_-]{20,40}\.zip$ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_read_timeout 25s;
}
